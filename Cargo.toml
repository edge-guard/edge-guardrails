[package]
name = "edgeguard-sdk"
version = "0.6.2"
edition = "2021"

[lib]
name = "edgeguard"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
aho-corasick = "1.1"
unicode-normalization = "0.1"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
regex = "1.13.1"

[features]
default = []
python = ["dep:pyo3"]

[build-dependencies]
cc = "1.4.6"
