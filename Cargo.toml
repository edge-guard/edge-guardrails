[package]
name = "edgeguard-sdk"
version = "0.6.1"
edition = "2021"

[lib]
name = "edgeguard"
crate-type = ["cdylib", "rlib"]

[dependencies]
aho-corasick = "1.1"
unicode-normalization = "0.1"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
