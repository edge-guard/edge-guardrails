[package]
name = "edgeguard-sdk"
version = "0.8.0"
edition = "2021"

[lib]
name = "edgeguard"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }
aho-corasick = "1.1"
unicode-normalization = "0.1"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
regex = "1.13.1"

[features]
default = ["audit-log"]
# Background SQLite audit log (threads + files): native builds only.
audit-log = ["dep:rusqlite"]
python = ["dep:pyo3", "audit-log"]
# WebAssembly build for Node.js / serverless: a C ABI over scan_all and redact.
wasm = []

[build-dependencies]
cc = "1.4.6"

# Small WebAssembly build: cargo build --profile wasm --target wasm32-unknown-unknown --no-default-features --features wasm
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
