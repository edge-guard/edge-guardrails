[package]
name = "edge_native_sdk"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29", features = ["bundled"] }
regex = "1.10"
lazy_static = "1.4"

[build-dependencies]
cc = "1.2"

[profile.release]
panic = "abort"