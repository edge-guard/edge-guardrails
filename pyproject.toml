[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# The distribution name MUST match the import name, and did not.
#
# This project published as `edgeguard-sdk` while importing as `edgeguard`.
# A separate `ctypes` package publishes as `edgeguard-ai` and also imports as
# `edgeguard`. pip tracks distributions, not import names, so:
#
#   * `pip uninstall edgeguard` removes neither of them;
#   * both can be installed at once, with no conflict reported;
#   * sys.path order decides which one `import edgeguard` gets, and the two
#     disagree about violation codes (1-6 vs 101/103/201/301-304/20000+).
#
# That is the shadowing bug, and renaming the distribution is the fix. Anyone
# holding the old name upgrades with:
#
#   pip uninstall -y edgeguard-sdk edgeguard-ai && pip install edgeguard
name = "edgeguard"
version = "0.9.0"
description = "On-device AI guardrails engine (Rust core, Python bindings via PyO3)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "llm", "guardrails", "prompt-injection", "pii", "security",
    "edge", "on-device", "rust",
]
# No runtime dependencies, deliberately. The engine is a compiled extension;
# `requests` is needed only by examples/ollama_stream_guard.py and belongs in
# the optional group below, not in what every install pulls.
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
examples = ["requests>=2.31"]
dev = ["maturin>=1.7,<2.0", "ruff", "black", "pytest"]

[project.urls]
Homepage = "https://github.com/shmuelhelman/edgeguard-sdk"
Repository = "https://github.com/shmuelhelman/edgeguard-sdk"
Issues = "https://github.com/shmuelhelman/edgeguard-sdk/issues"

[tool.maturin]
# Matches [project].name above. Keep them identical.
module-name = "edgeguard"
features = ["python"]
# sdist ONLY, and this is load-bearing rather than tidiness.
#
# `src/lib.rs` embeds these rules with `include_str!("../policy.yaml")`, so
# the file must be present to *compile* - an sdist without it cannot be built
# from source. The wheel needs no copy at all: the rules are already in the
# binary, and shipping a second copy beside it would create a file that looks
# authoritative, is not read by anything, and drifts.
#
# A caller who wants the text reads `edgeguard.DEFAULT_POLICY_YAML`.
include = [{ path = "policy.yaml", format = "sdist" }]

# Build the manylinux-compatible wheel by default on Linux. Without this,
# wheels are tagged `linux_x86_64`, which PyPI rejects and pip will not
# install on most distributions - the single most common reason a Rust
# extension "works locally" and is uninstallable everywhere else.
[tool.maturin.target.x86_64-unknown-linux-gnu]
manylinux = "2_17"

[tool.maturin.target.aarch64-unknown-linux-gnu]
manylinux = "2_17"
# =============================================================================
# Python tooling
# =============================================================================
# Pinned here rather than left to each developer's defaults, so `ruff check`
# and `black --check` mean the same thing locally and in CI.
#
# Line length matches rustfmt's default (100) rather than black's (88): this
# repository is majority Rust, and one width across both languages keeps
# side-by-side diffs and split-pane review aligned.

[tool.black]
line-length = 100
target-version = ["py39"]
extend-exclude = "/(\\.venv|target)/"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "target", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "RUF", "PL"]
ignore = [
    # Line length is the formatter's job; flagging it here too is noise.
    "E501",

    # --- rules that are actively wrong for THIS codebase ------------------
    #
    # RUF001/2/3 flag "ambiguous" Unicode - Cyrillic homoglyphs, fullwidth
    # forms, zero-width characters. This is a guardrail engine: those
    # characters are the red-team corpora. `comprehensive_test.py` alone trips
    # RUF001 111 times, every one of them a deliberate evasion payload the
    # de-obfuscator is tested against. Enforcing this rule would mean deleting
    # the test data.
    "RUF001",
    "RUF002",
    "RUF003",

    # Comparing against a literal status code or violation code is the
    # clearest way to write an assertion. 25 hits, all in test scripts.
    "PLR2004",

    # A router with one `return` per route is good structure, not a smell.
    "PLR0911",

    # The benchmark and audit demos are linear scripts by design; splitting
    # them into helpers would make them harder to read, not easier.
    "PLR0915",
    "PLW0603",
]
